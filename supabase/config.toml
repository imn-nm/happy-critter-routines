# The MyToki handheld sends its own token, which the function checks against mytoki_devices,
# not a signed-in user's JWT.
[functions.mytoki-device]
verify_jwt = false

# Called by a signed-in parent. Said out loud: a redeploy keeps whatever the
# function had, and it was once deployed without the check by mistake.
[functions.google-calendar-sync]
verify_jwt = true
