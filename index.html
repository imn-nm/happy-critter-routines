<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetPals - Children's Routine App</title>
    <meta name="description" content="Make daily routines fun and rewarding with virtual pet companions. Help your children build healthy habits while keeping their pet happy!" />
    <meta name="author" content="PetPals" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#452774" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="PetPals - Children's Routine App" />
    <meta property="og:description" content="Make daily routines fun and rewarding with virtual pet companions. Help your children build healthy habits while keeping their pet happy!" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root">
      <!-- Pre-React fallback — visible until JS mounts, helps diagnose blank screens -->
      <div id="app-loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(218% 145% at -22% -13%,#515AAD 13%,#452774 41%,#271447 65%,#08011A 100%)">
        <p style="color:#e4e6ff;font-family:Inter,system-ui,sans-serif;font-size:16px">Loading&hellip;</p>
      </div>
    </div>
    <script>
      window.__appMounted=false;
      window.onerror=function(m,s,l){
        var d=document.getElementById('app-loader');
        if(d)d.innerHTML='<div style="color:#ff8f91;font-family:system-ui,sans-serif;font-size:14px;padding:24px;text-align:left;max-width:400px;word-break:break-word">'
          +'<p style="color:#e4e6ff;font-size:18px;margin-bottom:12px">Failed to load app</p>'
          +'<p>'+m+'</p>'
          +'<p style="color:#9ea0c4;margin-top:8px;font-size:12px">'+s+':'+l+'</p>'
          +'<p style="color:#9ea0c4;margin-top:8px;font-size:11px">'+navigator.userAgent+'</p>'
          +'</div>';
      };
      setTimeout(function(){
        if(!window.__appMounted){
          var d=document.getElementById('app-loader');
          if(d)d.innerHTML='<div style="color:#fab047;font-family:system-ui,sans-serif;font-size:14px;padding:24px;text-align:left;max-width:400px;word-break:break-word">'
            +'<p style="color:#e4e6ff;font-size:18px;margin-bottom:12px">App did not load</p>'
            +'<p>The app failed to start after 8 seconds. Your browser may not support the required features.</p>'
            +'<p style="color:#9ea0c4;margin-top:12px;font-size:11px">'+navigator.userAgent+'</p>'
            +'</div>';
        }
      },8000);
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.onerror('Module script failed to load','main.tsx',0)"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function(){});
      }
    </script>
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#271447;color:#e4e6ff;font-family:system-ui,sans-serif;text-align:center;padding:24px">
        <p>JavaScript is required to run PetPals. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
  </body>
</html>
