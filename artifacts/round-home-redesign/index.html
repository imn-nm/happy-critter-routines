<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyToki room timer</title><style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Space+Grotesk:wght@400;500;600&display=swap');
*{box-sizing:border-box}body{margin:0;background:#c9cfc7;color:#20294a;font-family:'Space Grotesk',sans-serif}main{max-width:1100px;margin:auto;padding:44px 24px;display:grid;grid-template-columns:minmax(300px,600px) 1fr;gap:48px;align-items:center}h1{font-family:Unbounded,sans-serif;font-size:28px;line-height:1.4}p{line-height:1.6}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:#20294a;color:white}button:focus-visible,input:focus-visible{outline:3px solid #55846f;outline-offset:4px}label{display:block;margin:24px 0 8px}input{width:100%;accent-color:#517d65}.device{position:relative;aspect-ratio:1;border-radius:50%;padding:9%;background:linear-gradient(135deg,#39446a,#20294a 65%);box-shadow:0 22px 30px #20294a40,inset 0 2px 3px #697594}.device:before{content:'';position:absolute;right:17%;top:3%;width:13%;height:4%;background:#65cdaa;transform:rotate(30deg);z-index:-1}canvas{display:block;width:100%;border:8px solid #10172c;border-radius:50%;background:#222239}.note{font-size:14px;color:#55605b} @media(max-width:760px){main{grid-template-columns:1fr;gap:20px;padding:28px 20px}.device{max-width:580px;width:100%;margin:auto}h1{font-size:23px}}
</style></head><body><main><div class="device"><canvas id="screen" width="932" height="932" aria-label="Homework timer with Biscuit in his study"></canvas></div><aside><h1>A room to spend time in.</h1><p>The scene fills the display. A dedicated timer arc stays above the content, with a dark track behind every dot.</p><label for="time">Time left: <strong id="readout">12 minutes</strong></label><input id="time" type="range" min="0" max="20" value="12"><p class="note">Move the slider to see the dots count down. The task, side controls and Next card all stay clear of the timer.</p><button id="done">Press the hardware button</button><p id="status" aria-live="polite" class="note">Interactive layout study · 466 × 466 display</p></aside></main><script>
const c=document.getElementById('screen'),g=c.getContext('2d');g.scale(2,2);const S=466,C=233;
const rows=['.....WWWW......WWW...........','...WWWWWWWW..WWOWWWW.........','.WWWWWWOOWW..WWOOOWW.........','.WWWWOOOOWW..WWOOOWW.........','.....OOOOWW..WWOOOWW.........','.....WWWWWWWWWWOWWW..........',...Array(4).fill('..WWWWWWWWWWWWWWWWWWW........'),...Array(4).fill('WWKKKKWWWWWKKKKWWWWWWWW......'),'WWWWWWWPPWWWWWWWWWWWWWW......','WWWWWWWWWWWWWWWWWWWWWWW......','..WWWWWWWWWWWWWWWWWWW........','.......WWWWWWWWWWWWW.........','.....WWWWWWWWWWWWWWWWW.......','.....WWWWWWWWWWWWWWWWWWWWW...',...Array(4).fill('.....WWWWWWWWWWWWWWWWWWWWWWWW'),'.....WWWWWWWWWWWWWWWWWWWWW...','...WWWWWWWWWWWWWWWWWWW.......'];
const pal={W:'#f9f5e1',O:'#f7945a',K:'#010101',P:'#f17097'};let completed=false;
function dot(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function round(x,y,w,h,r,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function text(s,x,y,size,col='#eee9da',font='Space Grotesk',weight=500){g.font=weight+' '+size+'px "'+font+'"';g.textAlign='center';g.fillStyle=col;g.fillText(s,x,y)}
function draw(){g.clearRect(0,0,S,S);g.save();g.beginPath();g.arc(C,C,C,0,7);g.clip();g.fillStyle='#27223e';g.fillRect(0,0,S,S);
// Full-room dots: the bookshelf and lamp remain part of the child's world.
for(let y=0;y<S;y+=4.8)for(let x=0;x<S;x+=4.8){let col=y>310?'#363454':'#595083';if(x>85&&x<153&&y>176&&y<300){col='#78644d';if(x>93&&x<146&&y%40<30)col=['#638fbd','#f59a76','#98bb73'][Math.floor(x/9)%3]}if(x>336&&x<374&&y>197&&y<222)col='#d7ab58';if(x>353&&x<358&&y>220&&y<305)col='#968258';dot(x,y,1.6,col)}
let shade=g.createLinearGradient(0,0,0,S);shade.addColorStop(0,'#080d1bef');shade.addColorStop(.34,'#080d1b20');shade.addColorStop(.68,'#080d1b00');shade.addColorStop(1,'#080d1bf2');g.fillStyle=shade;g.fillRect(0,0,S,S);
// Upper timer sector: never shares space with navigation or the next card.
g.lineWidth=23;g.lineCap='round';g.strokeStyle='#101b23';g.beginPath();g.arc(C,C,207,Math.PI*1.12,Math.PI*1.88);g.stroke();const left=+document.getElementById('time').value;
for(let i=0;i<30;i++){let a=Math.PI*(1.12+.76*i/29);dot(C+207*Math.cos(a),C+207*Math.sin(a),4.4,completed?'#5fd9a0':i<Math.ceil(left/20*30)?'#dcef70':'#354443')}
text(completed?'All done!':'Homework',C,103,23,'#eee9da','Unbounded',600);text(completed?'You did it!':left+' min left',C,133,19,completed?'#5fd9a0':'#dcef70');
// Actual solid sprite grid, scaled with square cells.
g.imageSmoothingEnabled=false;rows.forEach((r,y)=>[...r].forEach((v,x)=>{if(pal[v]){g.fillStyle=pal[v];g.fillRect(172+x*4.3,182+y*4.3,4.4,4.4)}}));
round(12,211,44,44,22,'#101b23');round(410,211,44,44,22,'#101b23');text('☆',34,242,26);g.strokeStyle='#eee9da';g.lineWidth=1.8;for(let i=0;i<3;i++){g.beginPath();g.moveTo(424,226+i*7);g.lineTo(441,226+i*7);g.stroke()}
text('Next',C,361,13,'#b6b9c6');round(111,373,244,47,23,'#101b23');text('Soccer Practice',216,402,17,'#eee9da','Space Grotesk',600);text('4:00',323,402,14,'#b6b9c6');for(let i=0;i<3;i++)dot(C+(i-1)*12,438,3,i===1?'#eee9da':'#657079');
// Short action cue aligns with the physical button, outside the timer's sweep.
g.strokeStyle='#65cdaa';g.lineWidth=5;g.beginPath();g.arc(C,C,226,-.64,-.43);g.stroke();g.restore();document.getElementById('readout').textContent=left+' minutes'}
document.getElementById('time').oninput=()=>{completed=false;draw()};document.getElementById('done').onclick=()=>{completed=!completed;document.getElementById('status').textContent=completed?'Task completed. Free time is released.':'Interactive layout study · 466 × 466 display';draw()};document.fonts.ready.then(draw);draw();
</script></body></html>
